<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water potential: osmosis in action</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --page:#F1F6F7; --panel:#FFFFFF; --ink:#0C2A38; --ink2:#496572; --line:#D0DDE3; --soft:#E3EDF1;
  --stage1:#F4FAFC; --stage2:#D9ECF2; --edge:rgba(12,42,56,.12); --warn:#DF4F3E; --ok:#1E9C77;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#081922; --panel:#0F2733; --ink:#E8F3F7; --ink2:#9DB5C0; --line:#23414E; --soft:#15313D;
    --stage1:#123547; --stage2:#0A2532; --edge:rgba(232,243,247,.10); --warn:#F06C5A; --ok:#2CB88E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#081922; --panel:#0F2733; --ink:#E8F3F7; --ink2:#9DB5C0; --line:#23414E; --soft:#15313D;
  --stage1:#123547; --stage2:#0A2532; --edge:rgba(232,243,247,.10); --warn:#F06C5A; --ok:#2CB88E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow:hidden;background:var(--page);color:var(--ink);font:400 15px/1.35 var(--font)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #3462D6;outline-offset:2px}

.app{height:100%;display:grid;gap:8px 12px;padding:10px 14px 12px;
  grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"hd hd" "stage side" "why side"}
.hd{grid-area:hd;display:flex;align-items:center;gap:14px;min-width:0}
.hd h1{margin:0;font-size:1.35rem;line-height:1;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:3px;flex:1;max-width:560px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 8px;font-weight:700;font-size:.92rem;line-height:1.1;white-space:nowrap;display:flex;gap:7px;align-items:center;justify-content:center}
.tabs button i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--panel);color:var(--ink);display:grid;place-items:center;font-size:.78rem;font-weight:800}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--page)}
.prog{margin-left:auto;font-size:.86rem;color:var(--ink2);white-space:nowrap}
.prog b{color:var(--ink);font-weight:800}

.stage{grid-area:stage;position:relative;min-height:0;border-radius:18px;overflow:hidden;
  background:radial-gradient(120% 95% at 28% 12%,var(--stage1),var(--stage2));box-shadow:inset 0 0 0 1.5px var(--edge)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.why{grid-area:why;margin:0;padding:8px 14px;border-radius:12px;background:var(--ink);color:var(--page);font-size:.98rem;line-height:1.32;
  height:calc(2.64em + 16px);overflow:hidden;display:flex;align-items:center}
.why b{font-weight:800}

.side{grid-area:side;min-height:0;display:flex;flex-direction:column;gap:8px}
.grp{background:var(--panel);border-radius:14px;padding:9px 11px 10px;box-shadow:0 0 0 1px var(--line);min-width:0}
.grp h2{margin:0 0 7px;font-size:.84rem;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp h2 span{font-weight:400;color:var(--ink2)}
.link{border:0;background:none;padding:0;font-weight:700;font-size:.8rem;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{--c:#496572;display:flex;align-items:center;gap:8px;min-height:38px;padding:5px 9px;border-radius:10px;border:1.5px dashed var(--line);background:transparent;font-weight:700;font-size:.86rem;line-height:1.12;text-align:left}
.tool i{flex:none;width:18px;height:18px;border-radius:6px;border:2px solid var(--c);display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:800;color:var(--c);line-height:1}
.tool[aria-pressed="true"]{border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel))}
.tool[aria-pressed="true"] i{background:var(--c);color:#fff}
.tool small{display:block;font-weight:400;font-size:.72rem;color:var(--ink2)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-weight:700;font-size:.82rem;line-height:1.1}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--page)}
.opt.act{border-style:solid;background:var(--soft)}
.run{display:flex;gap:6px;align-items:center}
.btn{min-height:36px;padding:5px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:.86rem;white-space:nowrap}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--page);min-width:74px}
.spd{flex:1;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink2);min-width:0}
.spd input{flex:1;min-width:40px;accent-color:var(--ink)}
.check{flex:1;min-height:0;overflow:hidden}
.check ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.check li{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink2)}
.check li::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.check li.done{color:var(--ink);font-weight:700}
.check li.done::before{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 2.5px var(--panel)}

@media (max-height:720px) and (min-width:861px){
  .app{gap:6px 10px;padding:6px 12px 8px}
  .side{gap:6px}
  .grp{padding:6px 10px 7px}
  .grp h2{margin-bottom:5px}
  .tool{min-height:32px;padding:3px 8px}
  .tool small{display:none}
  .check li{font-size:.8rem}
  .check ol{gap:2px}
}
@media (max-width:860px){
  body{font-size:14px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"hd" "stage" "why" "side";gap:6px;padding:6px 8px 8px}
  .hd{gap:8px}
  .hd h1{display:none}
  .tabs{max-width:none}
  .tabs button{font-size:.8rem;padding:6px 2px;gap:4px}
  .tabs button i{width:17px;height:17px;font-size:.7rem}
  .prog{display:none}
  .stage{border-radius:14px}
  .why{font-size:.8rem;line-height:1.25;padding:5px 10px;height:calc(6.25em + 10px)}
  .side{gap:6px}
  .grp{padding:6px 8px 7px;border-radius:12px}
  .grp h2{font-size:.78rem;margin-bottom:5px}
  .tools{grid-template-columns:repeat(3,1fr);gap:5px}
  .tool{min-height:36px;padding:3px 6px;font-size:.76rem;gap:5px}
  .tool i{width:15px;height:15px;font-size:.7rem;border-radius:5px}
  .tool small{display:none}
  .opt{font-size:.76rem;padding:5px 9px}
  .btn{min-height:34px;padding:4px 9px;font-size:.8rem}
  .check{display:none}
  .grp.g-opts h2{display:none}
}
.opts{align-items:center}
.rng{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;flex:1 1 100%;white-space:nowrap}
.rng b{font-weight:800;min-width:4.2em}
.rng input{flex:1;min-width:60px;accent-color:var(--ink)}
.opts .btn.pri{min-height:34px}
@media (max-width:860px){.rng{font-size:.76rem}}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <h1>Water potential</h1>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-p="osm" aria-selected="true"><i>1</i>Osmosis</button>
      <button role="tab" data-p="cell" aria-selected="false"><i>2</i>Cells</button>
      <button role="tab" data-p="wp" aria-selected="false"><i>3</i>Water potential</button>
    </div>
    <div class="prog" id="prog"></div>
  </header>
  <section class="stage" aria-label="Simulation"><canvas id="cv" role="img" aria-label="Simulation of the selected process"></canvas></section>
  <p class="why" id="why" aria-live="polite"></p>
  <aside class="side">
    <div class="grp">
      <h2><span id="toolsTitle" style="font-weight:800;color:var(--ink)">Add a part</span><button class="link" id="all">Add everything</button></h2>
      <div class="tools" id="tools"></div>
    </div>
    <div class="grp g-opts">
      <h2>Change something</h2>
      <div class="opts" id="opts"></div>
    </div>
    <div class="grp">
      <div class="run">
        <button class="btn pri" id="play">Pause</button>
        
        <button class="btn" id="reset">Restart</button>
        <label class="spd">Speed<input id="speed" type="range" min="0.4" max="3" step="0.1" value="1" aria-label="Speed"></label>
      </div>
    </div>
    <div class="grp check">
      <h2>Key events</h2>
      <ol id="check"></ol>
    </div>
  </aside>
</div>
<script>
'use strict';
const TOOLS = {
  osm:[['mem','Partially permeable membrane','lets water through, not solute','#8A5BD1']],
  cell:[['wall','Cell wall','strong and rigid, as in plants','#1E9C77'],['cv','Contractile vacuole','pumps excess water out','#3462D6']],
  wp:[['vsol','Solutes in the vacuole','lower the solute potential','#C2327E'],['wall','Cell wall','lets pressure build up','#1E9C77']]
};
const TCOL = {}; Object.values(TOOLS).forEach(a=>a.forEach(t=>{ TCOL[t[0]] = t[3]; }));
const S = {proc:'osm', playing:true, speed:1, tools:{}, nL:2, nR:8, ions:true, ext:.3, c:.2};
Object.keys(TCOL).forEach(k=>{ S.tools[k] = false; });
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v)), rnd = (a,b)=>a+Math.random()*(b-a);
const WAT = '#4A9CC4', NA = '#F08A24', CL = '#1E9C77', GLU = '#C2327E';
let O, K, Q;

/* ================= 1: osmosis ================= */
function resetOsm(){ O = {f:.5, df:0, w:[], s:[], tm:0, xt:0, ev:{}}; for (let i=0;i<90;i++) O.w.push({L:i<45, u:Math.random(), v:Math.random()}); seedSol(); }
function seedSol(){ O.s = []; for (let i=0;i<S.nL;i++) O.s.push({L:true, u:rnd(.12,.88), v:rnd(.12,.9), k:i%2}); for (let i=0;i<S.nR;i++) O.s.push({L:false, u:rnd(.12,.88), v:rnd(.12,.9), k:i%2}); }
function stepOsm(dt){
  const mem = S.tools.mem; O.tm += dt;
  const nL = O.s.filter(q=>q.L).length, nR = O.s.length-nL, cL = nL/(2*O.f), cR = nR/(2*(1-O.f));
  O.cL = cL; O.cR = cR;
  O.df = mem ? .011*(cL-cR)+.02*(.5-O.f)*(nL+nR ? 0 : 1) : (.5-O.f)*1.2; O.f = clamp(O.f+O.df*dt,.2,.8);
  if (O.s.length) O.ev.solv = true;
  if (mem && Math.abs(O.df)>.004) O.ev.net = true; if (mem && Math.abs(O.f-.5)>.09) O.ev.lvl = true;
  if (mem && O.s.length && Math.abs(cL-cR)<.07*Math.max(cL,cR)) O.ev.iso = true;
  for (const q of O.s){ q.u = clamp(q.u+rnd(-1,1)*dt*.12,.08,.92); q.v = clamp(q.v+rnd(-1,1)*dt*.12,.1,.92);
    if (!mem && Math.random()<dt*.35){ const frac = nL/(nL+nR||1); if (Math.random()<(q.L ? frac : 1-frac)){ q.L = !q.L; q.u = q.L ? .9 : .1; O.ev.nomem = true; } } }
  for (const q of O.w){ q.u = clamp(q.u+rnd(-1,1)*dt*.5,.02,.98); q.v = clamp(q.v+rnd(-1,1)*dt*.5,.03,.97); }
  O.xt += dt; if (O.xt>.12){ O.xt = 0; const want = Math.round(90*O.f), have = O.w.filter(q=>q.L).length;
    const cross = toL => { const pool = O.w.filter(q=>q.L!==toL); if (!pool.length) return; const q = pool.sort((a,b)=>toL ? a.u-b.u : b.u-a.u)[Math.floor(rnd(0,Math.min(5,pool.length)))]; q.L = toL; q.u = toL ? .97 : .03; };
    if (have<want) cross(true); else if (have>want) cross(false); else if (mem && Math.random()<.5){ cross(true); cross(false); } }
}
function whyOsm(){
  const mem = S.tools.mem, n = O.s.length, d = (O.cL||0)-(O.cR||0), big = Math.max(O.cL||0,O.cR||0);
  const solv = S.ions ? 'Each ion is surrounded by water molecules: the slightly negative oxygen faces Na⁺ and the slightly positive hydrogens face Cl⁻.' : 'Each glucose molecule is polar, so water molecules form hydrogen bonds with it.';
  if (!mem && !n) return `<b>Pure water on both sides.</b> Set the amount of solute on each side, then add the partially permeable membrane.`;
  if (!mem) return `<b>No membrane: the solute simply diffuses</b> until it is spread evenly, and the levels stay equal. ${solv} This is solvation. Add the membrane to see osmosis.`;
  if (!n) return `<b>A partially permeable membrane with pure water on both sides.</b> Water molecules cross in both directions at the same rate, so nothing changes. Add solute to one side.`;
  if (Math.abs(d)<.07*big) return `<b>Isotonic: dynamic equilibrium.</b> The two solutions now have the same solute concentration. Water molecules still cross the membrane, but equal numbers go each way, so there is no net movement.`;
  const hi = d>0 ? 'left' : 'right', lo = d>0 ? 'right' : 'left';
  return `<b>Osmosis.</b> The ${hi} side is hypertonic (more solute); the ${lo} side is hypotonic. The solute cannot cross, so there is a net movement of water from the hypotonic side to the hypertonic side. The level rises there until the concentrations match.`;
}

/* ================= 2: cells in solutions ================= */
function resetCell(){ K = {V:1, J:0, burst:false, cvA:0, cvOut:0, tm:0, trace:[], ev:{}}; }
function stepCell(dt){
  const t = S.tools; K.tm += dt; if (K.burst){ K.trace.push({t:K.tm,V:0}); return; }
  const cin = .3/K.V, P = t.wall ? Math.max(0,K.V-1)*2.2 : 0; let J = .9*(cin-S.ext-P);
  K.cvOut = 0; if (t.cv && K.V>1.05 && J>0){ K.cvOut = J*.985; K.ev.cv = true; }
  K.J = J; K.V = clamp(K.V+(J-K.cvOut)*dt*.5,.42,3); K.cvA += dt*(2+K.cvOut*30);
  if (Math.abs(S.ext-.3)<.02 && Math.abs(K.V-1)<.03) K.ev.iso = true;
  if (J>.03 && S.ext<.27) K.ev.hypo = true;
  if (!t.wall && K.V>1.55){ K.burst = true; K.ev.burst = true; }
  if (!t.wall && K.V<.8) K.ev.cren = true;
  if (t.wall && K.V>1.07) K.ev.turg = true; if (t.wall && K.V<.9) K.ev.plas = true;
  K.trace.push({t:K.tm,V:K.V}); while (K.trace.length && K.trace[0].t<K.tm-14) K.trace.shift();
}
const cellKind = () => S.tools.wall ? 'plant cell' : S.tools.cv ? 'freshwater unicellular organism' : 'animal cell';
function cellState(){ const t = S.tools; if (K.burst) return 'burst (cytolysis)'; if (t.wall) return K.V>1.07 ? 'turgid' : K.V<.9 ? 'plasmolysed' : 'flaccid'; return K.V>1.2 ? 'swollen' : K.V<.8 ? 'crenated' : 'normal'; }
function whyCell(){
  const t = S.tools, e = S.ext, hypo = e<.27, hyper = e>.33;
  if (K.burst) return `<b>Cytolysis.</b> The solution outside was hypotonic, so water kept entering by osmosis. With no cell wall to resist, the plasma membrane stretched until it burst. Press Restart for a new cell, then try a cell wall or a contractile vacuole.`;
  if (!hypo && !hyper) return `<b>Isotonic.</b> Solute concentration is the same inside and out. Water enters and leaves at equal rates: dynamic equilibrium, no net change. ${t.wall ? 'A plant cell here is flaccid: not enough pressure to be turgid.' : 'This is why intravenous fluids and the solutions used to carry transplant organs are isotonic.'}`;
  if (hypo){
    if (t.wall) return `<b>Turgid.</b> Water enters the vacuole, which pushes the cytoplasm and membrane against the cell wall. This turgor pressure rises until the wall pushes back equally and no more water can enter. The wall stops the cell bursting, and turgor supports the plant.`;
    if (t.cv) return `<b>Osmoregulation.</b> Water keeps entering by osmosis, but the contractile vacuole collects it and pumps it out, so the cell does not burst. Freshwater unicellular organisms such as Paramecium depend on this.`;
    return `<b>Hypotonic outside: water is entering.</b> The cytoplasm is hypertonic to the solution, so there is a net movement of water into the cell. It has no cell wall, so it swells.`;
  }
  if (t.wall) return K.V<.9 ? `<b>Plasmolysis.</b> Water has left by osmosis. The vacuole and cytoplasm have shrunk and the plasma membrane has pulled away from the cell wall. If it stays like this the cell dies.` : `<b>Hypertonic outside: water is leaving.</b> Turgor pressure falls and the cell becomes flaccid.`;
  return K.V<.8 ? `<b>Crenation.</b> The solution outside is hypertonic, so water left the cell by osmosis and it has shrunk. Cells in a multicellular organism need isotonic tissue fluid to avoid this.` : `<b>Hypertonic outside: water is leaving</b> the cell by osmosis, and it is shrinking.`;
}

/* ================= 3: water potential ================= */
function resetWp(){ Q = {V:1, pts:[], tm:0, ev:{}}; }
const psiOut = c => -2440*c;
function psi(V){ const t = S.tools, s = t.vsol ? -900/V : 0, p = t.wall ? Math.max(0,(V-1)*6000) : 0; return {s, p, w:s+p}; }
function stepWp(dt){
  Q.tm += dt; const a = psi(Q.V), out = psiOut(S.c), d = out-a.w;
  Q.d = d; Q.V = clamp(Q.V+d*.00035*dt,.45,1.5);
  if (S.tools.vsol) Q.ev.sol = true; if (Math.abs(d)>60) Q.ev.move = true; if (a.p>150) Q.ev.pp = true;
  if (Math.abs(d)<15 && Q.V>.46 && Q.V<1.49 && Q.tm>2) Q.ev.eq = true; if (S.tools.wall && Q.V<.9) Q.ev.plas = true;
}
function eqV(c){ let V = 1; for (let k=0;k<4000;k++) V = clamp(V+(psiOut(c)-psi(V).w)*.00002,.45,1.5); return V; }
const massPct = V => V>=1 ? (V-1)*100 : (V-1)*45;
function record(){ const V = eqV(S.c), m = massPct(V), reps = [0,1,2,3,4].map(()=>m+rnd(-1,1)*1.4), mean = reps.reduce((a,b)=>a+b)/5, sd = Math.sqrt(reps.reduce((a,b)=>a+(b-mean)**2,0)/4);
  Q.pts = Q.pts.filter(p=>Math.abs(p.c-S.c)>.001); Q.pts.push({c:S.c, m:mean, se:sd/Math.sqrt(5)}); Q.pts.sort((a,b)=>a.c-b.c); if (Q.pts.length>=5) Q.ev.five = true; if (fit()) Q.ev.isot = true; }
function fit(){ const p = Q.pts; for (let i=0;i<p.length-1;i++) if (p[i].m>0 && p[i+1].m<=0) return {x0:p[i].c+(p[i+1].c-p[i].c)*p[i].m/(p[i].m-p[i+1].m)}; return null; }
function whyWp(){
  const t = S.tools, a = psi(Q.V), out = psiOut(S.c), d = out-a.w, f = fit();
  if (!t.vsol && !t.wall) return `<b>Water potential (ψ) is the potential energy of water per unit volume,</b> measured in kPa relative to pure water, which is 0. Add solutes to the vacuole and a cell wall, then change the solution outside.`;
  if (Math.abs(d)<15){
    if (!t.wall && Q.V>=1.49) return `<b>Still taking in water.</b> With no cell wall there is no pressure potential, so the cell’s water potential can never rise to match pure water. An animal cell would burst. Add the cell wall.`;
    return `<b>Equilibrium: ψ inside = ψ outside (${Math.round(out)} kPa).</b> ψw = ψs + ψp = ${Math.round(a.s)} + ${Math.round(a.p)}. ${a.p>50 ? 'The positive pressure potential from the cell wall balances the negative solute potential.' : 'There is no pressure potential: the membrane is not pressing on the wall.'}${f ? ` Your results cross zero at about ${f.x0.toFixed(2)} mol dm⁻³: the isotonic concentration.` : ' Record this result, then try other concentrations: the isotonic point is where the mass change crosses zero.'}`;
  }
  if (d>0) return `<b>Water moves in: from higher ψ outside (${Math.round(out)} kPa) to lower ψ inside (${Math.round(a.w)} kPa).</b> As the cell fills, its solutes are diluted (ψs rises a little)${t.wall ? ' and the contents press on the wall, so the pressure potential ψp rises' : ''}.`;
  return `<b>Water moves out: from higher ψ inside (${Math.round(a.w)} kPa) to lower ψ outside (${Math.round(out)} kPa).</b> Adding solute lowers a solution’s solute potential. As the cell loses water, its pressure potential falls${a.p<1 ? ' to zero and the membrane pulls away from the wall' : ''}.`;
}

/* ================= drawing ================= */
const cv = document.getElementById('cv'), c = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, TH = {}, font = 'sans-serif';
function theme(){ const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  TH = {ink:g('--ink'), ink2:g('--ink2'), panel:g('--panel'), page:g('--page'), line:g('--line'), warn:g('--warn'), ok:g('--ok')}; TH.dark = parseInt(TH.page.slice(1,3),16)<80;

  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.p) S.proc = d.p;
  else if (d.t) S.tools[d.t] = !S.tools[d.t];
  else if (d.o==='ions') S.ions = true; else if (d.o==='glu') S.ions = false;
  else if (d.o==='e0') S.ext = 0; else if (d.o==='e3') S.ext = .3; else if (d.o==='e6') S.ext = .6;
  else if (d.o==='rec') record(); else if (d.o==='clr') Q.pts = [];
  else if (b.id==='all'){ const on = !TOOLS[S.proc].every(t=>S.tools[t[0]]); TOOLS[S.proc].forEach(t=>{ S.tools[t[0]] = on; }); }
  else if (b.id==='play') S.playing = !S.playing;
  else if (b.id==='reset'){ if (S.proc==='osm') resetOsm(); else if (S.proc==='cell') resetCell(); else resetWp(); }
  else return;
  buildUI();
});
document.addEventListener('input', e=>{ const v = +e.target.value, id = e.target.id;
  if (id==='speed') S.speed = v;
  else if (id==='nL'||id==='nR'){ S[id] = v; $(id==='nL' ? '#oL' : '#oR').textContent = v; seedSol(); }
  else if (id==='ext'){ S.ext = v; $('#oE').textContent = v.toFixed(2); }
  else if (id==='conc'){ S.c = v; $('#oC').textContent = v.toFixed(2); } });
function resize(){ const r = cv.getBoundingClientRect(); if (!r.width) return; dpr = Math.min(window.devicePixelRatio||1,2); W = r.width; H = r.height; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
let tPrev = 0, uiT = 0;
const advance = dt => { if (S.proc==='osm') stepOsm(dt); else if (S.proc==='cell') stepCell(dt); else stepWp(dt); };
function loop(now){ requestAnimationFrame(loop); const dt = Math.min(.05,(now-tPrev)/1000||0); tPrev = now; if (S.playing) advance(dt*S.speed); draw(); uiT += dt; if (uiT>.2){ uiT = 0; refresh(); } }
theme(); resetOsm(); resetCell(); resetWp(); buildUI(); resize();
new ResizeObserver(resize).observe(cv);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(theme);
requestAnimationFrame(loop);
window.__w = {S, run(sec){ for (let k=0;k<sec*60;k++) advance(1/60); refresh(); }, get O(){ return O; }, get K(){ return K; }, get Q(){ return Q; }, fit, record};
</script>
